name: Quality checks

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check Linux deployment scripts
        run: |
          bash -n scripts/publish-static.sh scripts/install-nginx.sh scripts/test-deployment.sh
          pnpm test:deployment
      - run: pnpm run doctor --blocking warning
